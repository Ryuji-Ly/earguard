# CI: on every push and pull request, check that the app typechecks, builds,
# and passes the Cypress E2E tests against the production web build.
# Deploying is handled separately by Vercel's GitHub integration.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      # Serves dist/ the same way Vercel does (clean URLs: /login -> login.html),
      # waits until it responds, then runs every spec in cypress/e2e.
      - name: E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run serve:web
          wait-on: http://127.0.0.1:8081
          wait-on-timeout: 120
          browser: electron

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
