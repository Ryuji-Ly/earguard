# CI: on every push and pull request, check that the app typechecks, builds,
# and passes the Cypress E2E tests against the production web build.
# Deploying is handled separately by Vercel's GitHub integration.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      # Serves dist/ the same way Vercel does (clean URLs: /login -> login.html).
      # The trailing & keeps it running in the background for the next steps.
      - name: Start web server
        run: npm run serve:web > serve.log 2>&1 &

      # Retry until the server answers (max ~60 s), so Cypress never starts too early.
      - name: Wait for web server
        run: curl --retry 30 --retry-connrefused --retry-delay 2 --silent --fail --output /dev/null http://127.0.0.1:8081

      - name: E2E tests
        run: npx cypress run --browser electron

      - name: Show web server log
        if: failure()
        run: cat serve.log

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
